# Application
spring.application.name=endpointguard
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:endpointguard}
spring.datasource.username=${DB_USER:endpointguard}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# GitHub
app.github.token=${GITHUB_PAT:}
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}

# LLM
app.llm.provider=${LLM_PROVIDER:groq}
app.http.shared-timeout-seconds=5
app.llm.timeout-seconds=30
app.llm.groq.api-key=${GROQ_API_KEY:}
app.llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com}
app.llm.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
app.llm.openai.api-key=${OPENAI_API_KEY:}
app.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.llm.gemini.api-key=${GEMINI_API_KEY:}
app.llm.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.llm.max-retries=1

# Risk Engine
app.risk.thresholds.medium=0.6
app.risk.thresholds.high=0.8
app.risk.traffic.request-threshold=1000
app.risk.traffic.diff-size-threshold=500
app.risk.traffic.incident-count-threshold=5

# Post-merge monitoring
app.monitoring.window-hours=2
app.monitoring.check-interval-minutes=15
app.monitoring.min-sample-count=10

# Metrics poller
app.metrics.poll-interval-ms=60000
app.metrics.demo-api-base-url=${DEMO_API_URL:http://localhost:8081}

# Logging
logging.level.com.endpointguard=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.ai.openai.OpenAiChatModel=OFF

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
